        // --- DATA ---
        // Splash-free (Unsplash) images assigned contextually
        const tools = [
            { name: "Image Generator", tagline: "Free AI images, no limits", category: "AI Tools", image_url: "https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=600&q=80", url: "https://image-generator-green-pi.vercel.app/", status: "live" },
            { name: "Audio to Text", tagline: "Convert speech to text, fast", category: "AI Tools", image_url: "https://images.unsplash.com/photo-1589903308904-1010c2294adc?auto=format&fit=crop&w=600&q=80", url: "https://audio-to-text.zone.id/", status: "live" },
            { name: "Text to Voice", tagline: "Free ElevenLabs alternative", category: "AI Tools", image_url: "https://images.unsplash.com/photo-1528458876861-544fd1761a34?auto=format&fit=crop&w=600&q=80", url: "https://text-to-voice-generator.zone.id/", status: "live" },
            { name: "QR Code Scanner", tagline: "Scan and generate QR codes free", category: "Utility", image_url: "https://images.unsplash.com/photo-1595079676339-1534801ad6cb?auto=format&fit=crop&w=600&q=80", url: "#", status: "coming soon" },
            { name: "Background Remover", tagline: "Remove image backgrounds instantly", category: "AI Tools", image_url: "https://images.unsplash.com/photo-1633681926022-84c23e8cb2d6?auto=format&fit=crop&w=600&q=80", url: "#", status: "coming soon" },
            { name: "YT Thumbnail Down", tagline: "Download any YouTube thumbnail", category: "Utility", image_url: "https://images.unsplash.com/photo-1611162617474-5b21e879e113?auto=format&fit=crop&w=600&q=80", url: "https://yt-thumbnail-downloader-by-proxarmy.vercel.app/", status: "live" },
            { name: "Sub4Unlock", tagline: "Shorten links, unlock instantly", category: "Utility", image_url: "https://images.unsplash.com/photo-1614064641913-6b71a2bc47db?auto=format&fit=crop&w=600&q=80", url: "https://sub4unlock.zone.id/", status: "live" },
            { name: "Live TV Channels", tagline: "Stream live TV, free & instant", category: "Utility", image_url: "https://images.unsplash.com/photo-1593784991095-a205069470b6?auto=format&fit=crop&w=600&q=80", url: "https://live-tv-channels.zone.id/", status: "live" },
            { name: "Life Calculator", tagline: "Know your exact age, instantly", category: "Utility", image_url: "https://images.unsplash.com/photo-1506784951206-3962201a5a1f?auto=format&fit=crop&w=600&q=80", url: "https://life-calculator-iota.vercel.app/", status: "live" },
            { name: "HTML Code Encryptor", tagline: "Protect your source code", category: "Utility", image_url: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=600&q=80", url: "https://html-code-encrypt-generator.zone.id/", status: "live" },
            { name: "Wedding Cards", tagline: "Beautiful invitations in minutes", category: "Design", image_url: "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=600&q=80", url: "https://wedding-cards-nine.vercel.app/", status: "live" },
            { name: "Portfolio (SEO)", tagline: "AbheeBhai — SEO optimized", category: "Portfolio", image_url: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=600&q=80", url: "https://professor-abheebhai.zone.id/", status: "live" },
            { name: "Portfolio (Visual)", tagline: "AbheeBhai — visual showcase", category: "Portfolio", image_url: "https://images.unsplash.com/photo-1487017159836-4e23ece2e4cf?auto=format&fit=crop&w=600&q=80", url: "https://abheebhai-visual.vercel.app/", status: "live" },
            { name: "Portfolio (Main)", tagline: "AbheeBhai — main portfolio", category: "Portfolio", image_url: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=600&q=80", url: "https://professor-abheebhai-portfolio.vercel.app/", status: "live" },
            { name: "Sim Database", tagline: "Owner details & numbers", category: "Utility", image_url: "https://images.unsplash.com/photo-1633265486064-086b219458ce?auto=format&fit=crop&w=600&q=80", url: "https://sim-owner-details-azure.vercel.app/", status: "live" },

            { name: "CC Generator Pro", tagline: "Generate test card numbers", category: "Utility", image_url: "https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=600&q=80", url: "https://cc-generator-pro.vercel.app/", status: "live" }
        ];

        const ctaLinks = [
            { platform: "Telegram (Main)", icon: "send", url: "https://t.me/flexzone_official" },
            { platform: "Telegram (Prof)", icon: "send", url: "https://t.me/professorabheebhai" },
            { platform: "YouTube", icon: "youtube", url: "https://youtube.com/@abheebhai" },
            { platform: "GitHub", icon: "github", url: "https://github.com/professorAbheebhai/" },
            { platform: "WhatsApp Ch 1", icon: "message-circle", url: "https://whatsapp.com/channel/0029Vb7FZ4lBPzjb8g1Tux3l" },
            { platform: "WhatsApp Ch 2", icon: "message-circle", url: "https://whatsapp.com/channel/0029VbDAqSp3wtbHsfaauY0n" },
            { platform: "Earning Group", icon: "dollar-sign", url: "https://whatsapp.com/channel/0029VbB1V2uHFxP7QM70jK1F" },
            { platform: "WhatsApp Group", icon: "users", url: "https://whatsapp.com/channel/0029Vb93P6p2P59m2mM9dl2x" }
        ];

        const categories = ["All", "AI Tools", "Utility", "Design", "Portfolio"];
        let currentCategory = "All";
        let searchQuery = "";

        // --- DOM ELEMENTS ---
        const grid = document.getElementById("tools-grid");
        const filterContainer = document.getElementById("filter-container");
        const searchInput = document.getElementById("search-input");
        const noResults = document.getElementById("no-results");
        const ctaContainer = document.getElementById("cta-container");
        const countDisplay = document.getElementById("tool-count");

        // --- INITIALIZATION ---
        function init() {
            countDisplay.innerText = tools.length;
            renderFilters();
            renderCTA();
            renderGrid();
            lucide.createIcons();
            
            // Search Listener
            searchInput.addEventListener("input", (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderGrid();
            });
        }

        // --- RENDER FUNCTIONS ---
        function renderFilters() {
            filterContainer.innerHTML = categories.map(cat => `
                <button 
                    onclick="setCategory('${cat}')"
                    class="filter-chip px-5 py-2 rounded-full border border-slate-200 dark:border-slate-700 text-sm font-medium whitespace-nowrap ${currentCategory === cat ? 'active' : 'text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700'}"
                >
                    ${cat}
                </button>
            `).join("");
        }

        function setCategory(cat) {
            currentCategory = cat;
            renderFilters();
            renderGrid();
        }

        function renderGrid() {
            const filtered = tools.filter(tool => {
                const matchesCat = currentCategory === "All" || tool.category === currentCategory;
                const matchesSearch = tool.name.toLowerCase().includes(searchQuery) || tool.tagline.toLowerCase().includes(searchQuery);
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = "";
                noResults.classList.remove("hidden");
            } else {
                noResults.classList.add("hidden");
                grid.innerHTML = filtered.map((tool, index) => {
                    const isComingSoon = tool.status === "coming soon";
                    const delay = (index % 10) * 50; // Staggered animation capped
                    
                    return `
                        <div 
                            class="tool-card rounded-2xl flex flex-col bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 overflow-hidden cursor-${isComingSoon ? 'not-allowed opacity-75' : 'pointer'} animate-enter"
                            style="animation-delay: ${delay}ms"
                            ${!isComingSoon ? `onclick="window.open('${tool.url}', '_blank')"` : ''}
                        >
                            <!-- Splash Free Image Area -->
                            <div class="card-image-wrapper border-b border-slate-100 dark:border-slate-700">
                                <img src="${tool.image_url}" alt="${tool.name}" class="card-image w-full h-full object-cover">
                                <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
                                <span class="absolute bottom-3 left-3 text-[10px] font-bold tracking-wider text-white uppercase bg-black/30 backdrop-blur-md px-2 py-1 rounded">
                                    ${tool.category}
                                </span>
                            </div>

                            <!-- Content Area -->
                            <div class="p-5 flex-grow flex flex-col justify-between">
                                <div>
                                    <div class="flex justify-between items-start mb-1.5">
                                        <h3 class="text-base font-semibold text-slate-900 dark:text-white leading-tight">${tool.name}</h3>
                                        ${isComingSoon ? '<span class="text-[9px] font-bold tracking-wide text-amber-600 dark:text-amber-400 uppercase bg-amber-100 dark:bg-amber-900/40 px-2 py-0.5 rounded-sm ml-2 shrink-0">Soon</span>' : ''}
                                    </div>
                                    <p class="text-sm text-slate-500 dark:text-slate-400 line-clamp-2">${tool.tagline}</p>
                                </div>
                            </div>
                        </div>
                    `;
                }).join("");
            }
        }

        function renderCTA() {
            ctaContainer.innerHTML = ctaLinks.map(cta => `
                <a href="${cta.url}" target="_blank" class="flex items-center justify-center gap-3 p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 hover:border-slate-300 dark:hover:border-slate-600 hover:-translate-y-1 transition-all text-sm font-medium text-slate-700 dark:text-slate-200 shadow-sm">

                    <span class="truncate">${cta.platform}</span>
                </a>
            `).join("");
        }

        // Boot
        window.addEventListener('DOMContentLoaded', init);
    </script>
