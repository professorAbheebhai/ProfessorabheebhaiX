    <style>
        body {
            background-color: #fcfcfc;
            color: #0f172a;
            scroll-behavior: smooth;
        }

        /* Premium Card Hover Effects */
        .tool-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            background: #ffffff;
            border: 1px solid #e2e8f0;
            position: relative;
            overflow: hidden;
        }

        .tool-card:hover {
            transform: translateY(-4px);
            border-color: #cbd5e1;
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.08);
        }

        /* Subtle radial mouse-follow effect (implemented via JS) */
        .radial-highlight {
            position: absolute;
            pointer-events: none;
            background: radial-gradient(circle 300px at var(--x) var(--y), rgba(0, 0, 0, 0.03), transparent 80%);
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .tool-card:hover .radial-highlight {
            opacity: 1;
        }

        /* Category Filter Chips */
        .filter-chip {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .filter-chip.active {
            background-color: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }

        /* Card Image Area Fallback (Linear style) */
        .card-art {
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-bottom: 1px solid #f1f5f9;
        }

        /* Entrance Animation */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-enter {
            animation: slideUpFade 0.5s ease forwards;
            opacity: 0;
        }
        
        /* Hide scrollbar for category filters */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

            <!-- Adsterra Banner 320x50 (Mobile friendly) -->

    <!-- Application Logic -->
    <script>
        // --- DATA ---
        const tools = [
            { name: "Image Generator", tagline: "Free AI images, no limits", category: "AI Tools", icon: "image", url: "https://image-generator-green-pi.vercel.app/", status: "live", color: "text-purple-500" },
            { name: "Audio to Text", tagline: "Convert speech to text, fast", category: "AI Tools", icon: "mic", url: "https://audio-to-text.zone.id/", status: "live", color: "text-purple-500" },
            { name: "Text to Voice", tagline: "Free ElevenLabs alternative", category: "AI Tools", icon: "volume-2", url: "https://text-to-voice-generator.zone.id/", status: "live", color: "text-purple-500" },
            { name: "QR Code Scanner", tagline: "Scan and generate QR codes free", category: "Utility", icon: "qr-code", url: "#", status: "coming soon", color: "text-teal-500" },
            { name: "Background Remover", tagline: "Remove image backgrounds instantly", category: "AI Tools", icon: "scissors", url: "#", status: "coming soon", color: "text-purple-500" },
            { name: "YT Thumbnail Downloader", tagline: "Download any YouTube thumbnail in HD", category: "Utility", icon: "youtube", url: "https://yt-thumbnail-downloader-by-proxarmy.vercel.app/", status: "live", color: "text-teal-500" },
            { name: "Sub4Unlock", tagline: "Shorten links, unlock instantly", category: "Utility", icon: "link", url: "https://sub4unlock.zone.id/", status: "live", color: "text-teal-500" },
            { name: "Live TV Channels", tagline: "Stream live TV, free & instant", category: "Utility", icon: "tv", url: "https://live-tv-channels.zone.id/", status: "live", color: "text-teal-500" },
            { name: "Life Calculator", tagline: "Know your exact age, instantly", category: "Utility", icon: "calendar", url: "https://life-calculator-iota.vercel.app/", status: "live", color: "text-teal-500" },
            { name: "HTML Code Encryptor", tagline: "Protect your source code", category: "Utility", icon: "lock", url: "https://html-code-encrypt-generator.zone.id/", status: "live", color: "text-teal-500" },
            { name: "Wedding Cards", tagline: "Beautiful invitations in minutes", category: "Design", icon: "heart", url: "https://wedding-cards-nine.vercel.app/", status: "live", color: "text-pink-500" },
            { name: "Portfolio (SEO)", tagline: "AbheeBhai — SEO optimized", category: "Portfolio", icon: "user", url: "https://professor-abheebhai.zone.id/", status: "live", color: "text-indigo-500" },
            { name: "Portfolio (Visual)", tagline: "AbheeBhai — visual showcase", category: "Portfolio", icon: "palette", url: "https://abheebhai-visual.vercel.app/", status: "live", color: "text-indigo-500" },
            { name: "Portfolio (Main)", tagline: "AbheeBhai — main portfolio", category: "Portfolio", icon: "briefcase", url: "https://professor-abheebhai-portfolio.vercel.app/", status: "live", color: "text-indigo-500" },
            { name: "Sim Database", tagline: "Owner details & numbers", category: "Utility", icon: "database", url: "https://sim-owner-details-azure.vercel.app/", status: "live", color: "text-teal-500" },
            { name: "AbheeBhai Labs", tagline: "Experimental projects hub", category: "Portfolio", icon: "flask-conical", url: "https://abheebhai-labs.zone.id/", status: "live", color: "text-indigo-500" },
            { name: "CC Generator Pro", tagline: "Generate test card numbers", category: "Utility", icon: "credit-card", url: "https://cc-generator-pro.vercel.app/", status: "live", color: "text-teal-500" }
        ];

        const ctaLinks = [
            { platform: "Telegram (Main)", icon: "send", url: "https://t.me/flexzone_official" },
            { platform: "Telegram (Prof)", icon: "send", url: "https://t.me/professorabheebhai" },
            { platform: "YouTube", icon: "youtube", url: "https://youtube.com/@abheebhai" },
            { platform: "GitHub", icon: "github", url: "https://github.com/professorAbheebhai/" },
            { platform: "WhatsApp Channel 1", icon: "message-circle", url: "https://whatsapp.com/channel/0029Vb7FZ4lBPzjb8g1Tux3l" },
            { platform: "WhatsApp Channel 2", icon: "message-circle", url: "https://whatsapp.com/channel/0029VbDAqSp3wtbHsfaauY0n" },
            { platform: "Earning Opportunity", icon: "dollar-sign", url: "https://whatsapp.com/channel/0029VbB1V2uHFxP7QM70jK1F" },
            { platform: "WhatsApp Group", icon: "users", url: "https://whatsapp.com/channel/0029Vb93P6p2P59m2mM9dl2x" }
        ];

        const categories = ["All", "AI Tools", "Utility", "Design", "Portfolio"];
        let currentCategory = "All";
        let searchQuery = "";

        // --- DOM ELEMENTS ---
        const grid = document.getElementById("tools-grid");
        const filterContainer = document.getElementById("filter-container");
        const searchInput = document.getElementById("search-input");
        const noResults = document.getElementById("no-results");
        const ctaContainer = document.getElementById("cta-container");
        const countDisplay = document.getElementById("tool-count");

        // --- INITIALIZATION ---
        function init() {
            countDisplay.innerText = tools.length;
            renderFilters();
            renderCTA();
            renderGrid();
            lucide.createIcons();
            
            // Search Listener
            searchInput.addEventListener("input", (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderGrid();
            });
        }

        // --- RENDER FUNCTIONS ---
        function renderFilters() {
            filterContainer.innerHTML = categories.map(cat => `
                <button 
                    onclick="setCategory('${cat}')"
                    class="filter-chip px-4 py-1.5 rounded-full border border-slate-200 text-sm font-medium whitespace-nowrap ${currentCategory === cat ? 'active' : 'text-slate-600 bg-white hover:bg-slate-50'}"
                >
                    ${cat}
                </button>
            `).join("");
        }

        function setCategory(cat) {
            currentCategory = cat;
            renderFilters();
            renderGrid();
        }

        function renderGrid() {
            const filtered = tools.filter(tool => {
                const matchesCat = currentCategory === "All" || tool.category === currentCategory;
                const matchesSearch = tool.name.toLowerCase().includes(searchQuery) || tool.tagline.toLowerCase().includes(searchQuery);
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = "";
                noResults.classList.remove("hidden");
            } else {
                noResults.classList.add("hidden");
                grid.innerHTML = filtered.map((tool, index) => {
                    const isComingSoon = tool.status === "coming soon";
                    const delay = index * 50; // Staggered animation
                    
                    return `
                        <div 
                            class="tool-card rounded-[14px] flex flex-col cursor-${isComingSoon ? 'not-allowed opacity-70' : 'pointer'} animate-enter"
                            style="animation-delay: ${delay}ms"
                            ${!isComingSoon ? `onclick="window.open('${tool.url}', '_blank')"` : ''}
                            onmousemove="handleMouseMove(event, this)"
                        >
                            <div class="radial-highlight"></div>
                            
                            <!-- Custom Art/Icon Area (Fallback for Unsplash) -->
                            <div class="card-art relative">
                                <div class="absolute inset-0 bg-white opacity-40"></div>
                                <i data-lucide="${tool.icon}" class="w-12 h-12 ${tool.color} z-10 opacity-80"></i>
                            </div>

                            <!-- Content -->
                            <div class="p-5 flex-grow bg-white z-10">
                                <div class="flex justify-between items-start mb-1">
                                    <h3 class="text-sm font-semibold text-slate-900">${tool.name}</h3>
                                    ${isComingSoon ? '<span class="text-[10px] font-medium tracking-wide text-slate-400 uppercase bg-slate-100 px-2 py-0.5 rounded-sm">Soon</span>' : ''}
                                </div>
                                <p class="text-xs text-slate-500">${tool.tagline}</p>
                            </div>
                        </div>
                    `;
                }).join("");
                
                // Re-initialize icons for newly added HTML
                lucide.createIcons();
            }
        }

        function renderCTA() {
            ctaContainer.innerHTML = ctaLinks.map(cta => `
                <a href="${cta.url}" target="_blank" class="flex items-center justify-center gap-2 p-3 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 hover:border-slate-300 hover:-translate-y-1 transition-all text-sm font-medium text-slate-700 shadow-sm">
                    <i data-lucide="${cta.icon}" class="w-4 h-4 text-slate-500"></i>
                    <span class="truncate">${cta.platform}</span>
                </a>
            `).join("");
        }

        // --- MICRO-INTERACTIONS ---
        // Radial hover effect following the cursor
        function handleMouseMove(e, card) {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            card.style.setProperty('--x', `${x}px`);
            card.style.setProperty('--y', `${y}px`);
        }

        // Boot
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
